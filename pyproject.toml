[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nemoforge"
version = "0.1.0"
description = "NemoForge Agentic RAR — SAGE-10k physics validity + NF-Core benchmark pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Runtime deps that can be satisfied in a plain Python env.
# omni.* / pxr are provided by Isaac Sim — not listed here.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = ["E501"]
